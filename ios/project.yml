name: SwarmPanel

options:
  bundleIdPrefix: com.swarmpanel
  deploymentTarget:
    iOS: "16.0"
    tvOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      OTHER_SWIFT_FLAGS: "-D DEBUG"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: "YES"

targets:
  SwarmPanel:
    type: application
    platform: iOS
    sources:
      - path: SwarmPanel/Sources
      # Shared with SwarmPanelWidget so both targets agree on the App
      # Group's storage keys, the Live Activity's data shape, and the
      # control AppIntents (Skip/Pause/Resume/What's Playing — the widget's
      # buttons use these same intents, not a duplicate set) without
      # needing a separate framework target.
      - path: Shared/WidgetShared.swift
      - path: Shared/SwarmPanelControlIntents.swift
      # Rust app core: generated Swift API + the Swift bridge (storage,
      # live-socket wrapper, model conveniences). Built by
      # scripts/build-core.sh into RustCore/ before XcodeGen runs.
      - path: RustCore/SwarmPanelCore.swift
      - path: Shared/Core
      # Resonance (the visual language) pieces shared with the Apple TV app:
      # bot colours, hive geometry, the wave field and the equalizer.
      - path: Shared/Resonance.swift
    # Resources listed EXPLICITLY so XcodeGen creates a proper "Compile Asset
    # Catalogs" (actool) build phase — mirrors Lumisound's project.yml.
    resources:
      - path: SwarmPanel/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarmpanel.ios
        INFOPLIST_FILE: SwarmPanel/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPS_IN_ASSET_CATALOG_COMPILATION: "YES"
        CODE_SIGN_ENTITLEMENTS: SwarmPanel/Resources/SwarmPanel.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: SwarmPanelWidget
      - framework: RustCore/SwarmPanelCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    scheme:
      buildAction:
        targets:
          - SwarmPanel
      runAction:
        config: Debug
      testAction:
        config: Debug
      profileAction:
        config: Release
      archiveAction:
        config: Release
      analyzeAction:
        config: Debug
      testTargets:
        - SwarmPanelTests

  # Widget + Lock Screen/Dynamic Island Live Activity extension. Embedded in
  # the SwarmPanel app target above (dependencies:), so it ships inside the
  # same .ipa and installs automatically through the same AltStore sideload
  # flow as the app itself — no separate pairing/install step. Reads the
  # Now Playing + fleet status snapshot WidgetDataService writes to the
  # shared App Group container; its transport buttons call the shared
  # Skip/Pause/Resume AppIntents directly (a plain network POST via
  # FleetControlService, not a local audio engine call), so — unlike a
  # widget controlling on-device playback — it never needs the host app to
  # be alive to act.
  SwarmPanelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SwarmPanelWidget/Sources
      - path: Shared/WidgetShared.swift
      - path: Shared/SwarmPanelControlIntents.swift
      # Rust app core: generated Swift API + the Swift bridge (storage,
      # live-socket wrapper, model conveniences). Built by
      # scripts/build-core.sh into RustCore/ before XcodeGen runs.
      - path: RustCore/SwarmPanelCore.swift
      - path: Shared/Core
    dependencies:
      - framework: RustCore/SwarmPanelCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarmpanel.ios.widget
        INFOPLIST_FILE: SwarmPanelWidget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SwarmPanelWidget/SwarmPanelWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # Apple TV app: the Dashboard only, read-only, never in admin mode (see
  # SwarmPanelTV/Sources/SwarmPanelTVApp.swift). Uses the same Rust core as
  # the iOS app and widget.
  SwarmPanelTV:
    type: application
    platform: tvOS
    sources:
      - path: SwarmPanelTV/Sources
      - path: Shared/Resonance.swift
      # Rust app core: generated Swift API + the Swift bridge (storage,
      # live-socket wrapper, model conveniences). Built by
      # scripts/build-core.sh into RustCore/ before XcodeGen runs.
      - path: RustCore/SwarmPanelCore.swift
      - path: Shared/Core
    # Listed explicitly (like the iOS target) so XcodeGen creates a real
    # "Compile Asset Catalogs" phase: that's what produces Assets.car and
    # writes the app icon (CFBundleIcons) and Top Shelf (TVTopShelfImage)
    # entries into the built Info.plist.
    resources:
      - path: SwarmPanelTV/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarmpanel.tvos
        # tvOS icons are layered "brand assets" (App Icon + App Store icon +
        # Top Shelf images) rather than a flat .appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        PRODUCT_NAME: SwarmPanelTV
        INFOPLIST_FILE: SwarmPanelTV/Resources/Info.plist
        TVOS_DEPLOYMENT_TARGET: "17.0"
        # The project-level base settings are iPhone/iPad ones; 3 = Apple TV.
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - framework: RustCore/SwarmPanelCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    scheme:
      buildAction:
        targets:
          - SwarmPanelTV
      runAction:
        config: Debug
      archiveAction:
        config: Release

  SwarmPanelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwarmPanelTests
    dependencies:
      - target: SwarmPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarmpanel.ios.tests
        INFOPLIST_FILE: ""
